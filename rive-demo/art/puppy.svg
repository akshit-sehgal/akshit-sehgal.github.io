<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900">
  <!--
    Walking puppy, traced from the walking reference illustration.
    Coordinates are in the reference's pixel space (1000x900 crop).
    The generator (../puppy/generate_scene.py) converts this with `rive svg`
    and keys these groups by id:
      legBF legFF legBN legFN pawFN padsFN tail head earL earR
    Every animated group's transform is its pivot: legs are traced in the
    reference's stride and pivot at the hip (ground is y=862); the walk
    animation swings them from that pose. pawFN bends the lifted paw.
  -->
  <defs>
    <linearGradient id="orange" x1="0.2" y1="0.1" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F6AD58"/><stop offset="1" stop-color="#E98D3D"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7E6"/><stop offset="1" stop-color="#FBEBD2"/>
    </linearGradient>
    <linearGradient id="cream2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E5CA"/><stop offset="1" stop-color="#F0D9B8"/>
    </linearGradient>
    <style>
      .ink  { stroke: #5A3A22; stroke-width: 8; stroke-linejoin: round; stroke-linecap: round; }
      .line { fill: none; stroke: #5A3A22; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #5A3A22; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .fur  { fill: url(#cream); }
      .fur2 { fill: url(#cream2); }
      .orng { fill: url(#orange); }
    </style>
  </defs>

  <!-- ===== far back leg, shaded, behind the body (traced in the reference stride) ===== -->
  <g id="legBF" transform="translate(410 690)">
    <g transform="translate(-410 -690)">
      <path class="fur2 ink" d="M 360 700 C 362 720 366 735 372 748 C 382 775 400 800 420 828 C 428 840 436 850 450 852 C 470 854 492 854 506 850 C 520 844 522 822 512 806 C 500 794 482 790 468 784 C 452 772 444 754 446 738 C 448 722 460 708 470 698 Z"/>
      <path class="thin" d="M 438 822 C 442 832 444 842 446 850 M 462 818 C 466 830 468 840 468 850"/>
    </g>
  </g>

  <!-- ===== fluffy tail with an orange base and wag lines ===== -->
  <g id="tail" transform="translate(245 515)">
    <g transform="translate(-245 -515)">
      <path class="line" d="M 77 302 C 50 318 32 344 27 374 M 117 318 C 86 332 62 358 54 386"/>
      <path class="fur" d="M 262 500 C 236 484 214 460 210 430 C 206 404 222 380 250 372 C 252 352 236 336 205 330 C 170 326 132 340 108 360 L 98 374 C 84 390 74 410 76 432 L 52 442 C 54 478 64 506 84 528 L 92 548 C 98 566 112 580 132 588 C 156 596 184 594 204 584 C 230 560 248 530 262 500 Z"/>
      <path class="orng" d="M 196 398 C 214 396 226 408 222 428 C 226 450 244 476 262 500 C 248 520 222 530 196 524 C 166 518 146 496 148 472 C 150 456 160 446 168 440 C 168 418 180 400 196 398 Z"/>
      <path class="ink" fill="none" d="M 262 500 C 236 484 214 460 210 430 C 206 404 222 380 250 372 C 252 352 236 336 205 330 C 170 326 132 340 108 360 L 98 374 C 84 390 74 410 76 432 L 52 442 C 54 478 64 506 84 528 L 92 548 C 98 566 112 580 132 588 C 156 596 184 594 204 584 C 230 560 248 530 262 500 Z"/>
      <path class="thin" d="M 108 378 C 108 386 106 392 104 398 M 80 462 C 86 472 92 480 98 486 M 92 548 C 106 548 120 549 132 551"/>
    </g>
  </g>

  <!-- ===== torso: fill, orange back spot, outline ===== -->
  <path class="fur" d="M 250 505 C 330 480 450 470 520 490 C 600 502 700 530 750 560 C 782 600 772 660 722 700 C 640 730 520 728 430 718 C 340 708 262 696 210 664 C 178 628 186 562 250 505 Z"/>
  <path class="orng" d="M 258 508 C 320 486 420 478 486 496 C 492 520 478 548 446 562 C 406 580 362 596 316 600 C 284 602 262 588 256 562 C 252 544 252 524 258 508 Z"/>
  <path fill="#F5E0C0" d="M 528 498 C 610 520 700 546 752 566 C 762 590 744 612 704 606 C 640 598 566 566 528 498 Z"/>
  <path class="ink" fill="none" d="M 250 505 C 330 480 450 470 520 490 C 600 502 700 530 750 560 C 782 600 772 660 722 700 C 640 730 520 728 430 718 C 340 708 262 696 210 664 C 178 628 186 562 250 505 Z"/>
  <!-- belly and chest fur tufts -->
  <path class="thin" d="M 522 700 C 516 676 508 660 494 646 C 508 652 518 660 524 668 C 524 654 520 640 512 628 M 742 690 C 736 670 728 656 716 646 M 392 648 C 390 668 384 684 374 696"/>

  <!-- ===== near legs, in front of the body (no outline across the top) ===== -->
  <g id="legBN" transform="translate(270 640)">
    <g transform="translate(-270 -640)">
      <path class="fur" d="M 190 600 C 192 625 188 640 176 650 C 150 660 125 672 110 700 C 95 728 80 760 79 790 C 78 815 88 838 115 843 C 140 847 168 843 182 828 C 192 815 192 795 198 780 C 205 762 220 746 248 742 C 270 740 288 742 302 740 C 335 730 365 708 382 682 C 390 668 392 650 390 638 C 340 600 250 590 190 600 Z"/>
      <path class="ink" fill="none" d="M 190 600 C 192 625 188 640 176 650 C 150 660 125 672 110 700 C 95 728 80 760 79 790 C 78 815 88 838 115 843 C 140 847 168 843 182 828 C 192 815 192 795 198 780 C 205 762 220 746 248 742 C 270 740 288 742 302 740 C 335 730 365 708 382 682 C 390 668 392 650 390 638"/>
      <path class="thin" d="M 122 818 C 120 828 118 836 116 842 M 158 820 C 158 830 156 838 154 843 M 200 620 C 206 632 208 644 206 656"/>
    </g>
  </g>
  <g id="legFF" transform="translate(540 670)">
    <g transform="translate(-540 -670)">
      <path class="fur" d="M 474 680 C 468 720 464 760 470 800 C 474 830 480 856 500 866 C 530 874 580 874 608 866 C 630 856 632 828 620 812 C 610 798 596 792 582 790 C 580 770 586 745 600 722 C 612 704 626 690 640 676 C 600 660 520 660 474 680 Z"/>
      <path class="ink" fill="none" d="M 474 680 C 468 720 464 760 470 800 C 474 830 480 856 500 866 C 530 874 580 874 608 866 C 630 856 632 828 620 812 C 610 798 596 792 582 790 C 580 770 586 745 600 722 C 612 704 626 690 640 676"/>
      <path class="thin" d="M 548 838 C 554 848 556 858 554 868 M 580 832 C 588 844 590 856 588 866"/>
      <path class="thin" d="M 488 704 C 480 686 482 668 494 650 M 476 690 C 466 676 466 662 474 650 M 628 686 C 632 672 640 662 652 654"/>
    </g>
  </g>
  <g id="legFN" transform="translate(690 640)">
    <g transform="translate(-690 -640)">
      <path class="fur" d="M 690 600 C 715 610 735 622 750 634 C 772 652 792 672 812 694 L 790 812 C 770 806 750 790 730 776 C 704 758 680 740 660 726 C 640 712 640 640 690 600 Z"/>
      <path class="ink" fill="none" d="M 735 622 C 760 645 790 672 812 694 M 652 722 C 690 748 730 778 778 812"/>
      <!-- the paw bends at the wrist; its pink pads show while it is lifted forward -->
      <g id="pawFN" transform="translate(790 750)">
        <g transform="translate(-790 -750)">
          <path class="fur" d="M 812 694 C 840 688 872 694 886 716 C 898 740 894 780 870 800 C 850 816 816 820 790 812 C 770 806 760 790 762 770 C 764 740 784 702 812 694 Z"/>
          <path class="ink" fill="none" d="M 812 694 C 840 688 872 694 886 716 C 898 740 894 780 870 800 C 850 816 816 820 784 812"/>
          <path class="thin" d="M 802 706 C 808 712 812 718 814 726 M 860 708 C 866 714 868 722 868 730"/>
          <g id="padsFN">
            <ellipse cx="822" cy="788" rx="27" ry="16" transform="rotate(-20 822 788)" fill="#F2907A"/>
            <circle cx="826" cy="758" r="10" fill="#F2907A"/>
            <circle cx="852" cy="750" r="9" fill="#F2907A"/>
            <circle cx="867" cy="768" r="9" fill="#F2907A"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== red collar and gold paw tag ===== -->
  <path fill="#D9453A" class="ink" d="M 522 484 C 560 512 620 530 690 530 C 720 530 745 524 762 514 L 760 542 C 740 552 712 558 682 558 C 610 558 552 538 518 512 Z"/>
  <path class="line" d="M 718 554 C 714 562 716 570 720 574"/>
  <circle cx="722" cy="604" r="34" fill="#F2B43C" class="ink"/>
  <ellipse cx="722" cy="614" rx="11" ry="9" fill="#B07A2E"/>
  <circle cx="709" cy="598" r="5" fill="#B07A2E"/>
  <circle cx="722" cy="592" r="5" fill="#B07A2E"/>
  <circle cx="735" cy="598" r="5" fill="#B07A2E"/>

  <!-- ===== head; pivots near the neck ===== -->
  <g id="head" transform="translate(690 430)">
    <g transform="translate(-690 -430)">
      <!-- far ear, behind the head -->
      <g id="earR" transform="translate(815 115)">
        <g transform="translate(-815 -115)">
          <path class="orng ink" d="M 790 100 C 836 92 884 108 918 140 C 944 164 966 192 980 226 C 992 254 994 296 984 318 C 990 336 976 356 958 358 C 952 370 940 374 930 368 C 918 340 906 300 892 262 C 878 220 860 178 836 146 C 822 128 806 112 790 100 Z"/>
          <path class="thin" d="M 940 250 C 950 276 954 300 950 322 M 912 200 C 924 218 932 236 936 254"/>
        </g>
      </g>

      <!-- fluffy head: fill, eye patch, details, outline -->
      <path class="fur" d="M 545 135 C 560 110 578 94 602 82 C 604 62 622 50 646 46 C 662 34 696 28 722 32 C 742 36 750 48 742 60 C 736 68 722 72 712 74 C 742 80 770 90 792 104 C 832 128 862 168 880 216 C 896 262 906 322 900 380 C 894 430 870 470 830 492 C 792 512 742 516 702 506 C 650 518 596 506 548 490 L 530 500 L 522 480 L 502 488 L 496 466 L 476 470 L 482 446 C 470 400 480 250 545 135 Z"/>
      <path class="orng" d="M 556 126 C 616 116 678 132 704 168 C 730 208 736 288 726 334 C 716 370 672 382 622 380 C 580 378 546 372 520 362 C 524 290 532 200 556 126 Z"/>
      <path class="ink" fill="none" d="M 545 135 C 560 110 578 94 602 82 C 604 62 622 50 646 46 C 662 34 696 28 722 32 C 742 36 750 48 742 60 C 736 68 722 72 712 74 C 742 80 770 90 792 104 C 832 128 862 168 880 216 C 896 262 906 322 900 380 C 894 430 870 470 830 492 C 792 512 742 516 702 506 C 650 518 596 506 548 490 L 530 500 L 522 480 L 502 488 L 496 466 L 476 470 L 482 446"/>
      <path class="thin" d="M 652 66 C 664 74 672 86 674 100 M 742 90 C 752 94 760 102 764 112"/>

      <!-- eyes and brows -->
      <path class="line" d="M 636 222 C 644 204 660 196 678 198 M 800 178 C 810 170 822 168 832 172"/>
      <ellipse cx="692" cy="304" rx="32" ry="38" fill="#2E1A10"/>
      <circle cx="698" cy="294" r="10" fill="#FFFFFF"/>
      <ellipse cx="838" cy="266" rx="17" ry="26" fill="#2E1A10"/>
      <circle cx="834" cy="257" r="6" fill="#FFFFFF"/>

      <!-- open smile with tongue -->
      <path fill="#8C3B33" class="ink" d="M 804 392 C 820 388 838 380 848 368 C 856 392 852 424 840 446 C 826 458 806 456 798 440 C 792 424 796 404 804 392 Z"/>
      <path fill="#F08A84" d="M 800 418 C 810 402 836 400 848 416 C 848 440 836 454 818 453 C 804 452 796 436 800 418 Z"/>
      <path class="thin" style="stroke:#D9655E" d="M 824 414 L 822 440"/>
      <path class="line" d="M 752 366 C 760 384 782 394 802 388 M 840 344 L 846 362"/>
      <!-- nose -->
      <path fill="#3E2416" d="M 806 314 C 806 298 830 292 852 298 C 872 304 876 322 864 336 C 852 348 830 350 816 340 C 808 334 806 324 806 314 Z"/>
      <ellipse cx="826" cy="309" rx="10" ry="6" fill="#8A6250"/>

      <!-- blush -->
      <path class="thin" style="stroke:#F2958A" d="M 636 410 L 644 394 M 654 408 L 662 392 M 672 406 L 680 390 M 884 352 L 890 340 M 896 350 L 902 338"/>

      <!-- near ear, over the side of the head -->

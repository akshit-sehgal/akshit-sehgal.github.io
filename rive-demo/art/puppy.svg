        <g transform="translate(-530 -150)">
          <path class="orng ink" d="M 420 170 C 456 140 510 116 560 120 C 576 122 584 140 582 168 C 578 230 562 320 538 390 C 528 418 514 440 492 446 C 476 450 460 446 450 438 C 440 450 420 452 404 440 C 388 446 366 438 356 422 C 340 422 322 410 316 392 C 296 384 284 362 288 340 C 272 318 270 286 282 262 C 296 236 322 218 352 206 C 380 192 400 178 420 170 Z"/>
          <path class="thin" d="M 352 330 C 360 352 372 372 388 388 M 320 290 C 324 306 330 318 340 330 M 548 180 C 546 230 536 290 522 340"/>
        </g>
      </g>
    </g>
  </g>
</svg>
